# pytest's configuration. It lives here rather than in pyproject.toml: when
# this file exists, pytest ignores [tool.pytest.ini_options] there.
[pytest]
testpaths = tests
asyncio_mode = auto
# Every async test and fixture shares one event loop for the session, so the
# session-scoped fixtures (migrations, the infra check) and the tests run on
# the same loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --strict-markers --strict-config

# --strict-markers: a marker not listed here (or registered by a plugin in
# tests/_plugins/) is an error, so a typo can't silently skip a test.
markers =
    sanity: quick checks that the platform itself works (health, dependencies, wiring); run them alone with `pytest -m sanity`
    test_id(*ids): the story test case IDs (XXX-NNN) this test proves; run one with `pytest --test-id PLT-002` (tests/_plugins/test_ids.py)
