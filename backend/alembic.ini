# The host's migrations. Kalens keeps its own chain in a `[kalens]` section,
# added in story 5 (see Kalens' docs/migrations.md).
[alembic]
prepend_sys_path = .
script_location = %(here)s/app/db/migrations
version_locations = %(here)s/app/db/migrations/versions
path_separator = os
# sqlalchemy.url comes from app.core.config, see env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
